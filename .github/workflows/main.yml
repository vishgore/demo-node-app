name: Snyk Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  snyk_security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Snyk CLI and snyk-to-html
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a recent LTS version

      - name: Install Snyk CLI and snyk-to-html
        run: |
          npm install -g snyk
          npm install -g snyk-to-html

      - name: Authenticate Snyk CLI
        run: snyk auth "${{ secrets.SNYK_TOKEN }}"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} # Ensure SNYK_TOKEN is set as a repository secret

      # --- Snyk Open Source (Dependency) Scan ---
      - name: Install Node.js dependencies (Example for Open Source Scan)
        run: npm install # Or 'yarn install', 'pip install -r requirements.txt', etc.

      - name: Run Snyk Open Source Scan (SARIF output)
        id: snyk_oss_scan
        # Removed continue-on-error: true. The script will now control the step's success/failure.
        run: |
          # Run snyk test with --fail-on=high. If high/critical vulnerabilities are found, Snyk exits with 1.
          snyk test --all-projects --fail-on=high --sarif > snyk_oss_results.sarif
          SNYK_STATUS=$?
          echo "SNYK_OSS_EXIT_CODE=$SNYK_STATUS" >> $GITHUB_OUTPUT
          # If Snyk exits with 0 (no issues), the step succeeds.
          # If Snyk exits with 1 (vulnerabilities >= high), 2 (error), or 3 (no supported projects), the step fails.
          if [ "$SNYK_STATUS" -eq 0 ]; then
            exit 0 # Succeed the GitHub Actions step
          else
            exit 1 # Fail the GitHub Actions step (due to vulnerabilities, errors, or no projects)
          fi

      - name: Handle Snyk Open Source Scan Results
        if: steps.snyk_oss_scan.outputs.SNYK_OSS_EXIT_CODE == '0'
        run: |
          echo "✅ Snyk Open Source Scan: No vulnerabilities found (or none above 'high' severity)."

      - name: Handle Snyk Open Source Scan Vulnerabilities
        if: steps.snyk_oss_scan.outputs.SNYK_OSS_EXIT_CODE == '1'
        run: |
          echo "❌ Snyk Open Source Scan: High or Critical vulnerabilities found. Build will fail. Please review snyk_oss_results.sarif and snyk_oss_report.html"
          # The step has already been configured to fail if SNYK_STATUS is 1. No need for explicit exit 1 here.

      - name: Handle Snyk Open Source Scan Errors
        if: steps.snyk_oss_scan.outputs.SNYK_OSS_EXIT_CODE == '2'
        run: |
          echo "❌ Snyk Open Source Scan: An error occurred during the scan. Build will fail. Please check the logs."
          # The step has already been configured to fail if SNYK_STATUS is 2. No need for explicit exit 1 here.

      - name: Handle Snyk Open Source Scan - No Supported Projects
        if: steps.snyk_oss_scan.outputs.SNYK_OSS_EXIT_CODE == '3'
        run: |
          echo "❌ Snyk Open Source Scan: No supported projects detected for scan. Build will fail. Check your project structure."
          # The step has already been configured to fail if SNYK_STATUS is 3. No need for explicit exit 1 here.

      - name: Convert Snyk Open Source SARIF to HTML
        # Only run if Snyk scan completed successfully (0) or found vulnerabilities (1, before the step failed the build)
        # This ensures the SARIF file exists for conversion.
        if: success() || failure() # Run if the previous Snyk scan step completed (success or failure)
        run: snyk-to-html -i snyk_oss_results.sarif -o snyk_oss_report.html || true # Allow snyk-to-html to fail gracefully if SARIF is empty/invalid

      # --- Snyk Code Scan ---
      - name: Run Snyk Code Scan (SARIF output)
        id: snyk_code_scan
        # Removed continue-on-error: true
        run: |
          snyk code test --fail-on=high --sarif > snyk_code_results.sarif
          SNYK_STATUS=$?
          echo "SNYK_CODE_EXIT_CODE=$SNYK_STATUS" >> $GITHUB_OUTPUT
          if [ "$SNYK_STATUS" -eq 0 ]; then
            exit 0
          else
            exit 1
          fi

      - name: Handle Snyk Code Scan Results
        if: steps.snyk_code_scan.outputs.SNYK_CODE_EXIT_CODE == '0'
        run: |
          echo "✅ Snyk Code Scan: No code vulnerabilities found (or none above 'high' severity)."

      - name: Handle Snyk Code Scan Vulnerabilities
        if: steps.snyk_code_scan.outputs.SNYK_CODE_EXIT_CODE == '1'
        run: |
          echo "❌ Snyk Code Scan: High or Critical vulnerabilities found. Build will fail. Please review snyk_code_results.sarif and snyk_code_report.html"

      - name: Handle Snyk Code Scan Errors
        if: steps.snyk_code_scan.outputs.SNYK_CODE_EXIT_CODE == '2'
        run: |
          echo "❌ Snyk Code Scan: An error occurred during the scan. Build will fail. Please check the logs."

      - name: Handle Snyk Code Scan - No Supported Projects
        if: steps.snyk_code_scan.outputs.SNYK_CODE_EXIT_CODE == '3'
        run: |
          echo "❌ Snyk Code Scan: No supported projects detected for scan. Build will fail. Check your project structure."

      - name: Convert Snyk Code SARIF to HTML
        if: success() || failure()
        run: snyk-to-html -i snyk_code_results.sarif -o snyk_code_report.html || true

      # --- Snyk Container Scan ---
      - name: Build Docker Image (Example for Container Scan)
        run: docker build -t my-app-image . # Replace 'my-app-image' and '.' as needed

      - name: Run Snyk Container Scan (SARIF output)
        id: snyk_container_scan
        # Removed continue-on-error: true
        run: |
          snyk container test my-app-image --fail-on=high --sarif > snyk_container_results.sarif
          SNYK_STATUS=$?
          echo "SNYK_CONTAINER_EXIT_CODE=$SNYK_STATUS" >> $GITHUB_OUTPUT
          if [ "$SNYK_STATUS" -eq 0 ]; then
            exit 0
          else
            exit 1
          fi

      - name: Handle Snyk Container Scan Results
        if: steps.snyk_container_scan.outputs.SNYK_CONTAINER_EXIT_CODE == '0'
        run: |
          echo "✅ Snyk Container Scan: No container vulnerabilities found (or none above 'high' severity)."

      - name: Handle Snyk Container Scan Vulnerabilities
        if: steps.snyk_container_scan.outputs.SNYK_CONTAINER_EXIT_CODE == '1'
        run: |
          echo "❌ Snyk Container Scan: High or Critical vulnerabilities found. Build will fail. Please review snyk_container_results.sarif and snyk_container_report.html"

      - name: Handle Snyk Container Scan Errors
        if: steps.snyk_container_scan.outputs.SNYK_CONTAINER_EXIT_CODE == '2'
        run: |
          echo "❌ Snyk Container Scan: An error occurred during the scan. Build will fail. Please check the logs."

      - name: Handle Snyk Container Scan - No Supported Projects
        if: steps.snyk_container_scan.outputs.SNYK_CONTAINER_EXIT_CODE == '3'
        run: |
          echo "❌ Snyk Container Scan: No supported projects detected for scan. Build will fail. Check your project structure or image name."

      - name: Convert Snyk Container SARIF to HTML
        if: success() || failure()
        run: snyk-to-html -i snyk_container_results.sarif -o snyk_container_report.html || true

      # --- Snyk IaC (Infrastructure as Code) Scan ---
      - name: Run Snyk IaC Scan (SARIF output)
        id: snyk_iac_scan
        # Removed continue-on-error: true
        run: |
          snyk iac test --fail-on=high --sarif > snyk_iac_results.sarif
          SNYK_STATUS=$?
          echo "SNYK_IAC_EXIT_CODE=$SNYK_STATUS" >> $GITHUB_OUTPUT
          if [ "$SNYK_STATUS" -eq 0 ]; then
            exit 0
          else
            exit 1
          fi

      - name: Handle Snyk IaC Scan Results
        if: steps.snyk_iac_scan.outputs.SNYK_IAC_EXIT_CODE == '0'
        run: |
          echo "✅ Snyk IaC Scan: No IaC misconfigurations found (or none above 'high' severity)."

      - name: Handle Snyk IaC Scan Misconfigurations
        if: steps.snyk_iac_scan.outputs.SNYK_IAC_EXIT_CODE == '1'
        run: |
          echo "❌ Snyk IaC Scan: High or Critical misconfigurations found. Build will fail. Please review snyk_iac_results.sarif and snyk_iac_report.html"

      - name: Handle Snyk IaC Scan Errors
        if: steps.snyk_iac_scan.outputs.SNYK_IAC_EXIT_CODE == '2'
        run: |
          echo "❌ Snyk IaC Scan: An error occurred during the scan. Build will fail. Please check the logs."

      - name: Handle Snyk IaC Scan - No Supported Projects
        if: steps.snyk_iac_scan.outputs.SNYK_IAC_EXIT_CODE == '3'
        run: |
          echo "❌ Snyk IaC Scan: No supported projects detected for scan. Build will fail. Check your IaC file paths."

      - name: Convert Snyk IaC SARIF to HTML
        if: success() || failure()
        run: snyk-to-html -i snyk_iac_results.sarif -o snyk_iac_report.html || true

      # --- Optional: Upload Snyk results as artifacts ---
      - name: Upload Snyk Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: snyk-scan-results
          path: |
            snyk_oss_results.sarif
            snyk_oss_report.html
            snyk_code_results.sarif
            snyk_code_report.html
            snyk_container_results.sarif
            snyk_container_report.html
            snyk_iac_results.sarif
            snyk_iac_report.html
          retention-days: 5 # How long to keep the artifacts
