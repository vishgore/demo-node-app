name: Wrapper PR Status Checker

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR check statuses
        id: get-checks
        uses: octokit/request-action@v2.1.0
        with:
          route: GET /repos/{owner}/{repo}/commits/{commit_sha}/check-runs
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          commit_sha: ${{ github.event.pull_request.head.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Evaluate check results
        run: |
          # Parse the JSON output from the previous step
          checks=$(echo "${{ steps.get-checks.outputs.data }}" | jq -c '.check_runs[]')
          
          # Initialize a variable to track overall status
          failed_checks=()
          
          # Loop through each check run
          for check in $(echo "$checks" | jq -r '@base64'); do
            _jq() {
             echo "${check}" | base64 --decode | jq -r "$1"
            }
          
            check_name=$(_jq '.name')
            check_status=$(_jq '.status')
            check_conclusion=$(_jq '.conclusion')
          
            echo "Processing check: $check_name"
            echo "Status: $check_status, Conclusion: $check_conclusion"
          
            # If a check is complete and its conclusion is "failure" or "error", we'll mark the wrapper as failed
            if [ "$check_status" == "completed" ] && { [ "$check_conclusion" == "failure" ] || [ "$check_conclusion" == "error" ]; }; then
              failed_checks+=("$check_name")
            fi
          done
          
          # If we have any failed checks, fail the workflow and provide a list of them
          if [ ${#failed_checks[@]} -gt 0 ]; then
            echo "----------------------------------------------------"
            echo "Wrapper check failed because the following PR checks failed:"
            for failed_check in "${failed_checks[@]}"; do
              echo " - $failed_check"
            done
            echo "----------------------------------------------------"
            exit 1 # Exit with a non-zero code to fail the job
          else
            echo "All PR checks passed successfully."
          fi
