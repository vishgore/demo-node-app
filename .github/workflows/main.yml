name: List Failed PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  list_failed_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR number
        id: get_pr_number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Wait for other checks to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for other PR checks to complete..."
          while true; do
            PENDING_CHECKS_COUNT=$(gh pr checks ${{ env.PR_NUMBER }} --json name,state --jq 'map(select(.state == "pending" and .name != "list_failed_checks")) | length')
            
            echo "Current pending checks count (excluding this workflow): $PENDING_CHECKS_COUNT"

            if [ "$PENDING_CHECKS_COUNT" -eq 0 ]; then
              echo "All other checks are complete."
              break
            else
              echo "Waiting for 30 seconds before checking again..."
              sleep 30
            fi
          done

      - name: Check for and list failed checks
        id: check_failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for failed checks..."
          FAILED_CHECKS=$(gh pr checks ${{ env.PR_NUMBER }} --json name,state,bucket --jq 'map(select(.bucket == "fail")) | .[] | "Name: \(.name), State: \(.state)"')
          
          if [ -n "$FAILED_CHECKS" ]; then
            echo "::error::Found failed checks on the pull request."
            echo "$FAILED_CHECKS"
            exit 1
          else
            echo "No failed checks found. All required checks passed."
          fi
