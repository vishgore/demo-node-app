name: List All PR Checks (Robust Wait)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  list_all_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR number
        id: get_pr_number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Wait for other checks to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for other PR checks to complete..."
          while true; do
            # Get a list of checks that are still in a non-final state
            NON_FINAL_CHECKS=$(gh pr checks ${{ env.PR_NUMBER }} --json name,state,bucket --jq 'map(select(.state != "SUCCESS" and .state != "FAILURE" and .state != "SKIPPED" and .state != "CANCELLED" and .name != "list_all_checks")) | length')
            
            echo "Current non-final checks count (excluding this workflow): $NON_FINAL_CHECKS"

            if [ "$NON_FINAL_CHECKS" -eq 0 ]; then
              echo "All other checks are complete."
              break
            else
              echo "Waiting for 15 seconds before checking again..."
              sleep 15
            fi
          done

      - name: List all checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing all completed checks for PR #${{ env.PR_NUMBER }}"
          gh pr checks ${{ env.PR_NUMBER }} --json name,state,bucket,startedAt,completedAt --jq '.[] | "Name: \(.name), State: \(.state), Bucket: \(.bucket)"'
