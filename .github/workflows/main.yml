name: List PR Checks with Delay

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  list_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for checks to start
        run: |
          echo "Waiting 15 seconds to allow checks to start..."
          sleep 15
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR number
        id: get_pr_number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: List pull request checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing checks for PR #${{ env.PR_NUMBER }}"
          gh pr checks ${{ env.PR_NUMBER }} --json name,state,bucket,startedAt,completedAt --jq '.[] | "Name: \(.name), State: \(.state), Bucket: \(.bucket)"'
