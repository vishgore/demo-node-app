name: List Failed PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  list_failed_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR number
        id: get_pr_number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Wait for checks to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for all PR checks to complete..."
          while true; do
            PENDING_CHECKS_COUNT=$(gh pr checks ${{ env.PR_NUMBER }} --json name,state,bucket --jq 'map(select(.state == "pending")) | length')
            
            echo "Current pending checks count: $PENDING_CHECKS_COUNT"

            if [ "$PENDING_CHECKS_COUNT" -eq 0 ]; then
              echo "All checks are complete."
              break
            else
              echo "Waiting for 30 seconds before checking again..."
              sleep 30
            fi
          done

      - name: List failed checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing failed checks for PR #${{ env.PR_NUMBER }}"
          gh pr checks ${{ env.PR_NUMBER }} --json name,state,bucket --jq '.[] | select(.bucket == "fail") | "Name: \(.name), State: \(.state), Bucket: \(.bucket)"'
