name: Snyk Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  snyk_security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Snyk CLI and snyk-to-html
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a recent LTS version

      - name: Install Snyk CLI and snyk-to-html
        run: |
          npm install -g snyk
          npm install -g snyk-to-html

      - name: Authenticate Snyk CLI
        run: snyk auth "${{ secrets.SNYK_TOKEN }}"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} # Ensure SNYK_TOKEN is set as a repository secret

      # --- Snyk Open Source (Dependency) Scan ---
      - name: Install Node.js dependencies (Example for Open Source Scan)
        run: npm install # Or 'yarn install', 'pip install -r requirements.txt', etc.

      - name: Run Snyk Open Source Scan (SARIF output)
        id: snyk_oss_scan
        # The exit code of 'snyk test' will directly determine the success/failure of this GitHub Actions step.
        # Fails if high/critical severity vulnerabilities are found AND are upgradable.
        run: |
          snyk test --all-projects --severity-threshold=high --fail-on=upgradable --sarif > snyk_oss_results.sarif
          SNYK_STATUS=$?
          echo "SNYK_OSS_EXIT_CODE=$SNYK_STATUS" >> $GITHUB_OUTPUT
          # If SNYK_STATUS is non-zero (1, 2, or 3), this step will automatically fail.

      - name: Handle Snyk Open Source Scan Results
        # This step runs only if the snyk_oss_scan step succeeded (exit code 0).
        if: steps.snyk_oss_scan.outcome == 'success'
        run: |
          echo "✅ Snyk Open Source Scan: No high/critical upgradable vulnerabilities found."

      - name: Handle Snyk Open Source Scan Vulnerabilities
        # This step runs if the snyk_oss_scan step failed AND the Snyk exit code was 1 (vulnerabilities).
        if: steps.snyk_oss_scan.outcome == 'failure' && steps.snyk_oss_scan.outputs.SNYK_OSS_EXIT_CODE == '1'
        run: |
          echo "❌ Snyk Open Source Scan: High or Critical upgradable vulnerabilities found. Build will fail. Please review snyk_oss_results.sarif and snyk_oss_report.html"

      - name: Handle Snyk Open Source Scan Errors
        # This step runs if the snyk_oss_scan step failed AND the Snyk exit code was 2 (error).
        if: steps.snyk_oss_scan.outcome == 'failure' && steps.snyk_oss_scan.outputs.SNYK_OSS_EXIT_CODE == '2'
        run: |
          echo "❌ Snyk Open Source Scan: An error occurred during the scan. Build will fail. Please check the logs."

      - name: Handle Snyk Open Source Scan - No Supported Projects
        # This step runs if the snyk_oss_scan step failed AND the Snyk exit code was 3 (no supported projects).
        if: steps.snyk_oss_scan.outcome == 'failure' && steps.snyk_oss_scan.outputs.SNYK_OSS_EXIT_CODE == '3'
        run: |
          echo "❌ Snyk Open Source Scan: No supported projects detected for scan. Build will fail. Check your project structure."

      - name: Convert Snyk Open Source SARIF to HTML
        # Always attempt to convert to HTML if the scan step completed (success or failure).
        if: always()
        run: snyk-to-html -i snyk_oss_results.sarif -o snyk_oss_report.html || true # Allow snyk-to-html to fail gracefully if SARIF is empty/invalid

      # --- Snyk Code Scan ---
      - name: Run Snyk Code Scan (SARIF output)
        id: snyk_code_scan
        # The exit code of 'snyk code test' will directly determine the success/failure of this GitHub Actions step.
        # Fails if high/critical severity vulnerabilities are found.
        run: |
          snyk code test --severity-threshold=high --fail-on=high --sarif > snyk_code_results.sarif
          SNYK_STATUS=$?
          echo "SNYK_CODE_EXIT_CODE=$SNYK_STATUS" >> $GITHUB_OUTPUT
          # If SNYK_STATUS is non-zero (1, 2, or 3), this step will automatically fail.

      - name: Handle Snyk Code Scan Results
        if: steps.snyk_code_scan.outcome == 'success'
        run: |
          echo "✅ Snyk Code Scan: No high/critical code vulnerabilities found."

      - name: Handle Snyk Code Scan Vulnerabilities
        if: steps.snyk_code_scan.outcome == 'failure' && steps.snyk_code_scan.outputs.SNYK_CODE_EXIT_CODE == '1'
        run: |
          echo "❌ Snyk Code Scan: High or Critical code vulnerabilities found. Build will fail. Please review snyk_code_results.sarif and snyk_code_report.html"

      - name: Handle Snyk Code Scan Errors
        if: steps.snyk_code_scan.outcome == 'failure' && steps.snyk_code_scan.outputs.SNYK_CODE_EXIT_CODE == '2'
        run: |
          echo "❌ Snyk Code Scan: An error occurred during the scan. Build will fail. Please check the logs."

      - name: Handle Snyk Code Scan - No Supported Projects
        if: steps.snyk_code_scan.outcome == 'failure' && steps.snyk_code_scan.outputs.SNYK_CODE_EXIT_CODE == '3'
        run: |
          echo "❌ Snyk Code Scan: No supported projects detected for scan. Build will fail. Check your project structure."

      - name: Convert Snyk Code SARIF to HTML
        if: always()
        run: snyk-to-html -i snyk_code_results.sarif -o snyk_code_report.html || true

      # --- Snyk Container Scan ---
      - name: Build Docker Image (Example for Container Scan)
        # This step is required for Snyk Container to have an image to scan.
        # Replace 'my-app-image' and '.' with your actual image name and Dockerfile context.
        run: docker build -t my-app-image .

      - name: Run Snyk Container Scan (SARIF output)
        id: snyk_container_scan
        # The exit code of 'snyk container test' will directly determine the success/failure of this GitHub Actions step.
        # Fails if high/critical severity vulnerabilities are found AND are upgradable.
        run: |
          snyk container test my-app-image --severity-threshold=high --fail-on=upgradable --sarif > snyk_container_results.sarif
          SNYK_STATUS=$?
          echo "SNYK_CONTAINER_EXIT_CODE=$SNYK_STATUS" >> $GITHUB_OUTPUT
          # If SNYK_STATUS is non-zero (1, 2, or 3), this step will automatically fail.

      - name: Handle Snyk Container Scan Results
        if: steps.snyk_container_scan.outcome == 'success'
        run: |
          echo "✅ Snyk Container Scan: No high/critical upgradable container vulnerabilities found."

      - name: Handle Snyk Container Scan Vulnerabilities
        if: steps.snyk_container_scan.outcome == 'failure' && steps.snyk_container_scan.outputs.SNYK_CONTAINER_EXIT_CODE == '1'
        run: |
          echo "❌ Snyk Container Scan: High or Critical upgradable vulnerabilities found. Build will fail. Please review snyk_container_results.sarif and snyk_container_report.html"

      - name: Handle Snyk Container Scan Errors
        if: steps.snyk_container_scan.outcome == 'failure' && steps.snyk_container_scan.outputs.SNYK_CONTAINER_EXIT_CODE == '2'
        run: |
          echo "❌ Snyk Container Scan: An error occurred during the scan. Build will fail. Please check the logs."

      - name: Handle Snyk Container Scan - No Supported Projects
        if: steps.snyk_container_scan.outcome == 'failure' && steps.snyk_container_scan.outputs.SNYK_CONTAINER_EXIT_CODE == '3'
        run: |
          echo "❌ Snyk Container Scan: No supported projects detected for scan. Build will fail. Check your project structure or image name."

      - name: Convert Snyk Container SARIF to HTML
        if: always()
        run: snyk-to-html -i snyk_container_results.sarif -o snyk_container_report.html || true

      # --- Optional: Upload Snyk results as artifacts ---
      - name: Upload Snyk Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: snyk-scan-results
          path: |
            snyk_oss_results.sarif
            snyk_oss_report.html
            snyk_code_results.sarif
            snyk_code_report.html
            snyk_container_results.sarif
            snyk_container_report.html
          retention-days: 5 # How long to keep the artifacts
