name: Wrapper PR Status Checker

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR check statuses
        id: get-checks
        uses: octokit/request-action@v2.1.0
        with:
          route: GET /repos/{owner}/{repo}/commits/{commit_sha}/check-runs
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          commit_sha: ${{ github.event.pull_request.head.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Evaluate check results
        run: |
          checks_json='${{ steps.get-checks.outputs.data }}'
          
          # Use jq to directly filter and find failed checks.
          # The -e flag ensures a non-zero exit code if no results are found, which is what we want here.
          failed_checks=$(echo "$checks_json" | jq -r '.check_runs[] | select(.conclusion == "failure" or .conclusion == "error") | .name')
          
          if [ -n "$failed_checks" ]; then
            echo "----------------------------------------------------"
            echo "Wrapper check failed because the following PR checks failed:"
            echo "$failed_checks"
            echo "----------------------------------------------------"
            exit 1
          else
            echo "All required PR checks passed successfully."
          fi
