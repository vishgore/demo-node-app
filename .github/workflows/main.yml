name: List All PR Checks (Delayed)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  list_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for checks to initialize
        run: |
          echo "Waiting 30 seconds for checks to report their status..."
          sleep 30

      - name: Fetch and List all PR checks
        id: get-checks
        uses: octokit/request-action@v2.1.0
        with:
          route: GET /repos/{owner}/{repo}/commits/{commit_sha}/check-runs
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          commit_sha: ${{ github.event.pull_request.head.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log all check statuses
        run: |
          checks_json='${{ steps.get-checks.outputs.data }}'
          
          echo "--- All PR Check Statuses ---"
          echo "$checks_json" | jq -r '.check_runs[] | "Check: \(.name) | Status: \(.status) | Conclusion: \(.conclusion)"'
          echo "-----------------------------"
