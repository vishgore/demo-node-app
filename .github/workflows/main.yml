name: List PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  list_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR number
        id: get_pr_number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: List pull request checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing checks for PR #${{ env.PR_NUMBER }}"
          gh pr checks ${{ env.PR_NUMBER }} --json name,status,conclusion,startedAt,completedAt --jq '.[] | "Name: \(.name), Status: \(.status), Conclusion: \(.conclusion)"'
