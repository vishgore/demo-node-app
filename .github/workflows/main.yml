name: Snyk Open Source Scan with Exploit Maturity Filter

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  snyk_security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Snyk CLI and Tools
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk CLI and Filtering Tools
        run: |
          npm install -g snyk
          # Install snyk-filter for custom build-fail logic
          npm install -g snyk-filter
          # Install jq for parsing and formatting JSON results
          sudo apt-get install -y jq

      # --- Configuration Step: Create the Fail Gate Policy File ---
      # This step dynamically creates the snyk-filter policy file with the corrected jq logic.
      - name: Create snyk-filter Policy File
        run: |
          echo "Writing snyk-fail-gate.yml to the repository root..."
          cat <<EOF > snyk-fail-gate.yml
          filters:
            failOn: |
              # This corrected jq path handles the single root Snyk JSON object.
              .vulnerabilities[].exploit | select(. == "Mature" or . == "Proof of Concept")
          EOF
        
      - name: Authenticate Snyk CLI
        run: snyk auth "${{ secrets.SNYK_TOKEN }}"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # --- Snyk Open Source (Dependency) Scan ---
      - name: Install Node.js dependencies
        run: npm install # Adjust this command based on your project's package manager

      - name: Run Snyk Scan, Filter, and Save Results (FAIL GATE)
        id: snyk_oss_filter_gate
        run: |
          JSON_FILE="snyk_oss_results.json"
          FILTER_FILE="snyk-fail-gate.yml"

          echo "1. Running Snyk Open Source scan and saving JSON..."
          # Run Snyk and pipe output to the JSON file. Use || true to save the JSON even if issues are found.
          snyk test --all-projects --json > $JSON_FILE || true
          
          # Sanity check: ensure the file was created.
          if [ ! -s $JSON_FILE ]; then
            echo "Error: Snyk scan failed to generate valid JSON output."
            echo "SNYK_FILTER_RESULT=error" >> $GITHUB_OUTPUT
            exit 1 # Fail the step if no JSON file was created
          fi

          echo "2. Applying Exploit Maturity Filter from $FILTER_FILE..."
          
          # Pipe the saved JSON content through snyk-filter, using -i - (read from stdin) and the custom filter file.
          cat $JSON_FILE | snyk-filter -i - -f $FILTER_FILE
            
          FILTER_EXIT_CODE=$?
          
          if [ "$FILTER_EXIT_CODE" -eq 0 ]; then
            # Snyk filter found no matches (exit code 0)
            echo "SNYK_FILTER_RESULT=success" >> $GITHUB_OUTPUT
            echo "✅ Snyk Security Gate Passed: No high-maturity exploits found."
          else
            # Snyk filter found matches (exit code 1)
            echo "SNYK_FILTER_RESULT=failure" >> $GITHUB_OUTPUT
            echo "❌ Snyk Security Gate FAILED: High-maturity exploits detected."
            exit 1 # Explicitly fail the step, ensuring the workflow halts
          fi

      # --- Steps below use the snyk_oss_results.json file saved by the previous step ---

      - name: Generate Markdown Summary Table
        id: generate_summary
        # This step runs even if the previous step failed, to generate the failure report for the PR comment.
        if: always()
        run: |
          FILTER_RESULT="${{ steps.snyk_oss_filter_gate.outputs.SNYK_FILTER_RESULT }}"

          if [ "$FILTER_RESULT" == "success" ]; then
            SUMMARY="✅ **Snyk Security Gate Passed:** No issues found with 'Mature' or 'Proof of Concept' exploit maturity."
          else
            SUMMARY="❌ **Snyk Security Gate FAILED:** The build was blocked due to high-risk vulnerabilities with 'Mature' or 'Proof of Concept' exploits. Fix the following issues immediately:"
            
            if [ -s snyk_oss_results.json ]; then
              
              # Corrected JQ FILTER for single root object JSON
              VULN_DATA=$(jq -r '
                . as $root | 
                # Start with project context
                "**Project:** \($root.projectName) (\($root.displayTargetFile))\n" + 
                "| Severity | Exploit Maturity | Vulnerability | Package |\n" + 
                "| :---: | :---: | :--- | :--- |" + 
                # Map and filter the vulnerabilities array
                (
                  $root.vulnerabilities[] | 
                  # Filter only for Mature or Proof of Concept issues
                  select(.exploit == "Mature" or .exploit == "Proof of Concept") | 
                  # Format the output row
                  "| **\(.severity | ascii_upcase)** | \(.exploit) | \(.title) | \(.packageName) |"
                )
              ' snyk_oss_results.json)
              
              SUMMARY="${SUMMARY}\n\n${VULN_DATA}"
            else
              SUMMARY="${SUMMARY}\n\n*Error: The JSON file was not generated during the scan.*"
            fi
          fi

          # Set the summary as an output variable for the next step
          echo "SUMMARY<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && always()
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.generate_summary.outputs.SUMMARY }}

      # --- Upload Snyk results as artifacts ---
      - name: Upload Snyk Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-oss-scan-results
          path: |
            snyk-fail-gate.yml # Also upload the policy for review
            snyk_oss_results.json
          retention-days: 5
